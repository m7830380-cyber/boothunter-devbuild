name: Compile Ren'Py Dev Build

on:
  workflow_dispatch: {}

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Download Ren'Py SDK
        run: |
          wget -q "https://www.renpy.org/dl/8.5.2/renpy-8.5.2-sdk.tar.bz2" -O renpy_sdk.tar.bz2
          tar xjf renpy_sdk.tar.bz2
          ls | grep renpy

      - name: Download game folder
        run: |
          wget -q "https://github.com/${{ github.repository }}/releases/download/game-v1/colab_game.zip" -O colab_game.zip
          mkdir -p gamebuild
          cd gamebuild && unzip -q ../colab_game.zip
          mv colab_game game
          ls game

      - name: Compile with real Ren'Py SDK
        run: |
          SDK_DIR=$(ls -d renpy-*-sdk)
          chmod +x "$SDK_DIR/renpy.sh" "$SDK_DIR/lib/py3-linux-x86_64/python" || true
          "$SDK_DIR/renpy.sh" "$GITHUB_WORKSPACE/gamebuild" compile

      - name: Sanity check compiled files
        run: |
          MI=gamebuild/game/scripts/Classes/00_membershipInstallation.rpyc
          DO=gamebuild/game/scripts/Classes/99_developer_override.rpyc
          echo "membershipInstallation.rpyc:"; ls -la "$MI" || echo "MISSING"
          echo "developer_override.rpyc:"; ls -la "$DO" || echo "MISSING"
          echo "--- log.txt (if any) ---"
          cat gamebuild/game/log.txt 2>/dev/null | tail -60 || true
          test -f "$MI"
          test -f "$DO"

      - name: Clone rpatool
        run: git clone -q https://github.com/Shizmob/rpatool.git rpatool

      - name: Repackage into 0script.rpa
        run: |
          cd gamebuild/game
          python3 "$GITHUB_WORKSPACE/rpatool/rpatool" -c "$GITHUB_WORKSPACE/0script.rpa" .
          ls -lh "$GITHUB_WORKSPACE/0script.rpa"

      - name: Upload result as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload game-v1 0script.rpa --repo ${{ github.repository }} --clobber

      - name: Upload as artifact too
        uses: actions/upload-artifact@v4
        with:
          name: 0script-rpa
          path: 0script.rpa
